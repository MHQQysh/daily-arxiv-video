name: 部署到 GitHub Pages

on:
  workflow_dispatch:
    inputs:
      add_new_papers:
        description: '是否真实新增论文（不勾选则只预览并刷新现有站点）'
        required: false
        type: boolean
        default: false
      target_date:
        description: '可选：只补指定 arXiv 发布日期（YYYY-MM-DD）'
        required: false
        type: string
        default: ''
  schedule:
    # 每日北京时间中午12:17（UTC 4:17）运行，避开 GitHub Actions 整点高峰
    - cron: '17 4 * * *'
    # 临时端到端验证：每 5 分钟尝试一次，确认 schedule 自动触发后删除
    - cron: '*/5 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "daily-video-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        
      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 运行单元测试
        run: python -m unittest discover -s tests -v

      - name: 安装 Playwright 依赖
        run: |
          npm install
          npx playwright install --with-deps chromium
          
      - name: 运行 arXiv 爬虫
        timeout-minutes: 3
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.add_new_papers }}" = "true" ]; }; then
            python -u scripts/arxiv_crawler.py
          else
            python -u scripts/arxiv_crawler.py --dry-run
          fi
        env:
          ARXIV_QUERY_KEYWORD: 'ti:video'
          ARXIV_FALLBACK_QUERY: 'all:video'
          ARXIV_TARGET_DATE: ${{ inputs.target_date }}
          ARXIV_DAILY_RESULTS: 10
          ARXIV_PRIMARY_RESULTS: 30
          ARXIV_FALLBACK_RESULTS: 70
          ARXIV_PAGE_SIZE: 70
          ARXIV_DELAY_SECONDS: 3
          ARXIV_REQUEST_TIMEOUT_SECONDS: 10
          ARXIV_RETRY_BASE_SECONDS: 5
          ARXIV_MAX_RETRIES: 2

      - name: 生成论文摘要
        run: |
          python scripts/generate_summaries.py
        env:
          MODELSCOPE_ACCESS_TOKEN: ${{ secrets.MODELSCOPE_ACCESS_TOKEN }}
          MODELSCOPE_MODELS: deepseek-ai/DeepSeek-V4-Flash-0731,Tencent-Hunyuan/Hy3,stepfun-ai/Step-3.7-Flash,ZhipuAI/GLM-5.2,deepseek-ai/DeepSeek-V4-Pro
          HTML_MAX_CHARS: 90000

      - name: 抓取论文首图
        run: |
          python scripts/fetch_paper_images.py --max-items 0

      - name: 生成首图截图兜底队列
        run: |
          python scripts/build_paper_image_fallback_queue.py --max-items 0

      - name: Playwright 截图兜底
        run: |
          npm run paper-image:fallbacks

      - name: 注册截图兜底首图
        run: |
          python scripts/register_paper_image_fallbacks.py

      - name: PDF 首图最终兜底
        run: |
          python scripts/fetch_pdf_fallback_images.py --max-items 0
          
      - name: 检查 Google Analytics 配置
        run: |
          if [ -n "$GA_MEASUREMENT_ID" ]; then
            echo "已读取 GA_MEASUREMENT_ID（值不会打印）"
          else
            echo "未读取 GA_MEASUREMENT_ID，网站将不加载 GA4"
          fi
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID || secrets.GA_MEASUREMENT_ID }}

      - name: 构建网站
        run: |
          python scripts/build_site.py
        env:
          ARXIV_QUERY_KEYWORD: 'ti:video'
          SITE_TOPIC_LABEL: Video
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID || secrets.GA_MEASUREMENT_ID }}

      - name: 提交更改
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add papers.md
          git add -f site
          if git diff --staged --quiet; then
            echo "没有更改需要提交"
          else
            CURRENT_DATE=$(date '+%Y-%m-%d')
            git commit -m "自动更新：爬取新论文并生成摘要 - $CURRENT_DATE [skip ci]"
            git push
          fi
          
      - name: 设置 Pages
        uses: actions/configure-pages@v5
        
      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
