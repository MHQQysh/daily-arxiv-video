name: 处理已导入 Video 论文

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装 Playwright 依赖
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: 为已导入论文生成中文摘要
        run: python scripts/generate_summaries.py
        env:
          MODELSCOPE_ACCESS_TOKEN: ${{ secrets.MODELSCOPE_ACCESS_TOKEN }}
          MODELSCOPE_MODELS: deepseek-ai/DeepSeek-V4-Flash-0731,Tencent-Hunyuan/Hy3,stepfun-ai/Step-3.7-Flash,ZhipuAI/GLM-5.2,deepseek-ai/DeepSeek-V4-Pro
          HTML_MAX_CHARS: 90000

      - name: 抓取最新论文首图
        run: python scripts/fetch_paper_images.py --max-items 0

      - name: 生成首图截图兜底队列
        run: python scripts/build_paper_image_fallback_queue.py --max-items 0

      - name: Playwright 截图兜底
        run: npm run paper-image:fallbacks

      - name: 注册截图兜底首图
        run: python scripts/register_paper_image_fallbacks.py

      - name: PDF 首图最终兜底
        run: python scripts/fetch_pdf_fallback_images.py --max-items 0

      - name: 构建 Video 网站
        run: python scripts/build_site.py
        env:
          ARXIV_QUERY_KEYWORD: 'ti:video'
          SITE_TOPIC_LABEL: Video
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID || secrets.GA_MEASUREMENT_ID }}

      - name: 提交生成结果
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add papers.md
          git add -f site
          if git diff --staged --quiet; then
            echo "没有更改需要提交"
          else
            git commit -m "生成近一个月 Video 论文摘要与站点 [skip ci]"
            git push
          fi

      - name: 设置 Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
